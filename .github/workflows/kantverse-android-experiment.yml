name: Kantverse Android experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/kantverse-network-wake-v0.1
    paths:
      - "apps/multiplatform/common/src/androidMain/kotlin/chat/simplex/common/helpers/NetworkObserver.kt"
      - "apps/multiplatform/**"
      - ".github/workflows/kantverse-android-experiment.yml"
      - "README.md"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure separate experimental app
        shell: bash
        run: |
          cat > apps/multiplatform/local.properties <<'EOF'
          compression.level=0
          enable_debuggable=true
          application_id.suffix=.kantverseexp
          app.name=SimpleX x Kantverse Experimental
          EOF

      - name: Build FOSS debug APK
        working-directory: apps/multiplatform
        run: |
          chmod +x gradlew
          ./gradlew assembleFossDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact
          find apps/multiplatform/android/build/outputs/apk -type f -name "*.apk" -print -exec cp {} artifact/ \;
          ls -lah artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simplex-kantverse-experimental-v0.1
          path: artifact/*.apk
          if-no-files-found: error
